name: Get Buffer IDs

on:
  workflow_dispatch:

jobs:
  fetch-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Fetch Organization and Channel IDs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python -c '
          import os
          import requests

          api_key = os.getenv("BUFFER_API_KEY")
          url = "https://api.buffer.com"
          headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}

          query = """
          {
            account {
              organizations {
                id
                name
              }
            }
          }
          """

          response = requests.post(url, json={"query": query}, headers=headers).json()
          print("API Response (Organizations):", response)

          try:
              orgs = response["data"]["account"]["organizations"]
              for org in orgs:
                  org_id = org["id"]
                  org_name = org["name"]
                  print("\n👉 FOUND BUFFER_ORG_ID:", org_id, "(Organization:", org_name, ")")
                  
                  # Updated type to OrganizationId! to match Buffer schema
                  chan_query = """
                  query GetChannels($orgId: OrganizationId!) {
                    channels(input: { organizationId: $orgId }) {
                      id
                      name
                      service
                    }
                  }
                  """
                  chan_res = requests.post(url, json={"query": chan_query, "variables": {"orgId": org_id}}, headers=headers).json()
                  print("API Response (Channels for " + org_id + "):", chan_res)
                  
                  channels = chan_res["data"]["channels"]
                  for ch in channels:
                      print("   📱 FOUND BUFFER_CHANNEL_ID:", ch["id"], "(Channel:", ch["name"], "-", ch["service"].upper(), ")")
          except Exception as e:
              print("❌ Error processing response data. Check the full JSON output above.")
          '
