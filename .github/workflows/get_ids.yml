name: Get Buffer IDs

on:
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  fetch-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Fetch Organization and Channel IDs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python -c '
          import os
          import requests

          api_key = os.getenv("BUFFER_API_KEY")
          url = "https://api.buffer.com"
          headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}

          # 1. Fetch Organizations
          org_query = """
          query {
            account {
              organizations {
                id
                name
              }
            }
          }
          """
          org_res = requests.post(url, json={"query": org_query}, headers=headers).json()
          print("--- ORGANIZATIONS ---")
          print(org_res)

          try:
              orgs = org_res["data"]["account"]["organizations"]
              for org in orgs:
                  org_id = org["id"]
                  print(f"\n👉 BUFFER_ORG_ID: {org_id} ({org[\"name\"]})")

                  # 2. Fetch Channels for this Organization
                  chan_query = """
                  query GetChannels($orgId: ID!) {
                    channels(input: { organizationId: $orgId }) {
                      id
                      name
                      service
                    }
                  }
                  """
                  chan_res = requests.post(url, json={"query": chan_query, "variables": {"orgId": org_id}}, headers=headers).json()
                  print(f"--- CHANNELS FOR {org_id} ---")
                  print(chan_res)
          except Exception as e:
              print("❌ Could not parse organizations/channels automatically. Check raw json above.")
          '
