name: Autonomous Tech Content Pipeline

on:
  schedule:
    # 1st Run: 10:00 AM UTC (Global Morning Peak: Europe, Africa, & Early Americas)
    - cron: '0 10 * * *'
    # 2nd Run: 6:00 PM UTC (Global Evening/Mid-day Peak: Europe, Africa, & Americas)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Mobile

jobs:
  publish-daily-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pillow imageio imageio-ffmpeg pyav

      - name: Execute Autonomous Posting Pipeline
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_YT_CHANNEL_ID: ${{ secrets.BUFFER_YT_CHANNEL_ID }}
          BUFFER_TWITTER_CHANNEL_ID: ${{ secrets.BUFFER_TWITTER_CHANNEL_ID }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID }}
        run: python post_daily.py
