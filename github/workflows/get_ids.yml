name: Get Buffer IDs

on:
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  fetch-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Fetch Organization and Channel IDs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python -c '
          import os
          import requests

          api_key = os.getenv("BUFFER_API_KEY")
          url = "https://api.buffer.com"
          
          query = """
          {
            organizations {
              id
              name
              channels {
                id
                name
                service
              }
            }
          }
          """

          response = requests.post(
              url,
              json={"query": query},
              headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
          )

          print("API Response:")
          print(response.json())
          '
